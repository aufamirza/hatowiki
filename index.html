  <!-- Judul, deskripsi, canonical, hreflang, Open Graph, data terstruktur (JSON-LD), dan atribut lang diisi per
       halaman & bahasa dari src/seo/pageMeta.js: saat build oleh scripts/build-seo.mjs (satu salinan berkas ini per
       halaman, beserta isi halamannya di #root untuk hub, daftar, dan detail), dan di browser oleh Layout setiap kali
       pindah halaman. Berkas sumbernya berisi versi beranda Indonesia. -->
  <link rel="canonical" href="https://www.hatowiki.site/" />
  <link rel="alternate" hreflang="id" href="https://www.hatowiki.site/" />

  <script type="application/ld+json" id="structured-data">{"@context":"https://schema.org","@graph":[{"@type":"WebSite","@id":"https://www.hatowiki.site/#website","name":"Hatowiki","alternateName":"Heartopia Wiki Indonesia","url":"https://www.hatowiki.site/","inLanguage":"id"}]}</script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Plus+Jakarta+Sans:wght@400..700&display=swap" />
  <style>
    /* Isi statis yang tidak di-hydrate (lihat skrip di bawah & src/main.jsx) disembunyikan sampai aplikasi selesai
       dirender, supaya tidak sempat tampil lalu berganti. */
    html[data-csr] #root { visibility: hidden; }
  </style>
  <script>
    // Pasang tema sebelum render supaya tidak berkedip: pilihan tersimpan dari tombol tema, kalau belum pernah memilih
    // selalu light (tidak mengikuti pengaturan sistem).
    (function () {
      var theme
      try { theme = localStorage.getItem('hdx-theme') } catch (e) {}
      document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light'
    })();
    // Bahasa (lihat src/i18n/locales.js): pengunjung yang pernah memilih Thai atau Inggris dan membuka alamat tanpa
    // awalan diarahkan ke versi /th atau /en halaman yang sama; alamat yang sudah berawalan selalu dihormati. Halaman
    // /th dan /en langsung diberi atribut lang-nya, dan font Thai hanya dimuat di /th (supaya versi lain tidak
    // mengunduhnya).
    (function () {
      var path = location.pathname
      var prefix = /^\/(th|en)(?=\/|$)/.exec(path)
      var chosen
      try { chosen = localStorage.getItem('hdx-lang') } catch (e) {}
      if (!prefix && (chosen === 'th' || chosen === 'en')) {
        document.documentElement.setAttribute('data-csr', '')
        // Awalan /id tidak dipakai: /id/x → /th/x.
        if (path === '/id' || path.indexOf('/id/') === 0) path = path.slice(3) || '/'
        location.replace('/' + chosen + (path === '/' ? '' : path) + location.search + location.hash)
        return
      }
      if (!prefix) return
      document.documentElement.lang = prefix[1]
      if (prefix[1] !== 'th') return
      var font = document.createElement('link')
      font.id = 'font-th'
      font.rel = 'stylesheet'
      font.href = 'https://fonts.googleapis.com/css2?family=Anuphan:wght@400..700&display=swap'
      document.head.appendChild(font)
    })();
    // Isi halaman di HTML statis (atribut data-ssr = alamat yang dirender, scripts/build-seo.mjs) hanya dipakai ulang
    // (hydrate) kalau alamat yang dibuka sama persis dan tanpa query (filter daftar di URL). Kalau tidak, data-csr:
    // isinya disembunyikan dan aplikasi merender ulang dari awal (src/main.jsx).
    (function () {
      var root = document.documentElement
      var rendered = root.getAttribute('data-ssr')
      if (rendered === null) return
      var path = location.pathname.replace(/\/+$/, '') || '/'
      if (path !== rendered || location.search) root.setAttribute('data-csr', '')
    })()
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
