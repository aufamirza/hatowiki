<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Wiki komunitas Heartopia berbahasa Indonesia: data ikan, jadwal, cuaca, lokasi, dan waktu server." />
  <meta name="theme-color" content="#faf5ec" />
  <meta name="application-name" content="Hatowiki" />
  <meta property="og:site_name" content="Hatowiki" />
  <title>Hatowiki | Wiki Komunitas Heartopia</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Plus+Jakarta+Sans:wght@400..700&display=swap" />
  <script>
    // Pasang tema sebelum render supaya tidak berkedip: pilihan tersimpan, kalau tidak ada ikuti sistem.
    (function () {
      var theme
      try { theme = localStorage.getItem('hdx-theme') } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      document.documentElement.dataset.theme = theme
    })()
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
